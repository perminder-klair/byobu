[package]
name = "byobu-panel"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software"] }
ureq = { version = "2", default-features = false }

[features]
# Draws straight to the display with no compositor, which is how it runs on the panel. Needs
# libinput, libudev, libgbm and libxkbcommon to build, so it's left out of a build on a desk.
kms = ["slint/backend-linuxkms-noseat"]

[build-dependencies]
slint-build = "1.18"

[profile.release]
lto = true
codegen-units = 1
strip = true
